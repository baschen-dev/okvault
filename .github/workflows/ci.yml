name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Lint the vault (OKF conformance)
        run: go run ./cmd/okvault lint --vault vault
      - name: Generated indexes are up to date
        shell: bash
        run: |
          go run ./cmd/okvault index --vault vault
          git diff --exit-code -- vault
