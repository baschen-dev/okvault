# Builds the Obsidian plugin and publishes it as a GitHub release when a vX.Y.Z tag
# is pushed. The release carries main.js, manifest.json and styles.css as separate
# assets, the layout Obsidian and BRAT install from. Bump the version first with
# `just plugin-version X.Y.Z`; the tag must match obsidian-plugin/manifest.json.
# Obsidian's community directory picks up the release from the root manifest.json.
# The assets get build provenance attestations (gh attestation verify).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json
      - name: Tag matches the plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          for f in manifest.json package.json ../manifest.json; do
            got=$(node -p "require('./$f').version")
            if [ "$got" != "$want" ]; then
              echo "::error file=obsidian-plugin/$f::version is $got but the tag is $TAG; run 'just plugin-version $want', merge, then tag again"
              exit 1
            fi
          done
          min=$(node -p "require('./manifest.json').minAppVersion")
          rec=$(node -p "require('../versions.json')['$want'] ?? ''")
          if [ "$rec" != "$min" ]; then
            echo "::error file=versions.json::versions.json has no \"$want\": \"$min\" entry; run 'just plugin-version $want'"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            obsidian-plugin/main.js
            obsidian-plugin/manifest.json
            obsidian-plugin/styles.css
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release made by hand (gh release create) also pushes the tag that runs
          # this workflow: then only replace its assets with the CI build.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css --verify-tag --generate-notes --title "$TAG"
          fi
