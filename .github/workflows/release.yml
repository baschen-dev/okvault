# Builds the Obsidian plugin and publishes it as a GitHub release when a vX.Y.Z tag
# is pushed. Bump the version first with `just plugin-version X.Y.Z`; the tag must
# match obsidian-plugin/manifest.json. Don't create the release by hand.
#
# The release is published under the bare version tag X.Y.Z, on the same commit:
# Obsidian's community directory only installs from a release whose tag equals the
# manifest version. vX.Y.Z is the Go tag (go install, git describe); the program job
# publishes the okvault binaries for each system under it, as a release of its own.
# The release carries main.js, manifest.json and styles.css as separate assets, the
# layout Obsidian and BRAT install from.
# The assets get build provenance attestations (gh attestation verify); the
# community directory checks them through GitHub, so no bundle file is attached
# (it flags extra release files Obsidian doesn't download).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json
      - name: Tag matches the plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          for f in manifest.json package.json ../manifest.json; do
            got=$(node -p "require('./$f').version")
            if [ "$got" != "$want" ]; then
              echo "::error file=obsidian-plugin/$f::version is $got but the tag is $TAG; run 'just plugin-version $want', merge, then tag again"
              exit 1
            fi
          done
          min=$(node -p "require('./manifest.json').minAppVersion")
          rec=$(node -p "require('../versions.json')['$want'] ?? ''")
          if [ "$rec" != "$min" ]; then
            echo "::error file=versions.json::versions.json has no \"$want\": \"$min\" entry; run 'just plugin-version $want'"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - name: Obsidian's lint rules (what the community directory checks)
        run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Attest the release assets
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            obsidian-plugin/main.js
            obsidian-plugin/manifest.json
            obsidian-plugin/styles.css
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          assets=(main.js manifest.json styles.css)
          if gh release view "$version" >/dev/null 2>&1; then
            # A re-run: replace the assets with this build.
            gh release upload "$version" "${assets[@]}" --clobber
          else
            gh release create "$version" "${assets[@]}" --target "$GITHUB_SHA" --generate-notes --title "$version"
          fi

  # The okvault program, for people who don't have Go. It gets its own release,
  # under the vX.Y.Z tag: the plugin's X.Y.Z release must carry only the files
  # Obsidian installs. Not marked latest, so the plugin release stays the one
  # GitHub and BRAT show first.
  program:
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build for each system
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for t in windows/amd64 windows/arm64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${t%/*}" arch="${t#*/}"
            name="okvault_${TAG}_${os}_${arch}"
            exe=okvault; [ "$os" = windows ] && exe=okvault.exe
            mkdir -p "build/$name"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "build/$name/$exe" ./cmd/okvault
            cp LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > "okvault_${TAG}_checksums.txt")
          ls -l dist
      - name: Attest the program archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/okvault_*
      - name: Publish the program release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            notes=$(printf '%s\n' \
              "The okvault program $TAG, for the Obsidian plugin $version and for agents such as Claude Code." \
              "" \
              "Download the file for your system, unpack it, and set the plugin's **okvault binary** setting to the full path of \`okvault\` (\`okvault.exe\` on Windows). Setup steps: https://github.com/baschen-dev/okvault#get-started" \
              "" \
              "| System | File |" \
              "|---|---|" \
              "| Windows | \`okvault_${TAG}_windows_amd64.zip\` (\`arm64\` for ARM laptops) |" \
              "| macOS, Apple silicon (M1 and later) | \`okvault_${TAG}_darwin_arm64.tar.gz\` |" \
              "| macOS, Intel | \`okvault_${TAG}_darwin_amd64.tar.gz\` |" \
              "| Linux | \`okvault_${TAG}_linux_amd64.tar.gz\` (\`arm64\` for ARM) |" \
              "" \
              "Release notes: https://github.com/baschen-dev/okvault/releases/tag/$version" \
              "" \
              "Verify a download: \`gh attestation verify FILE --repo baschen-dev/okvault\`")
            gh release create "$TAG" dist/* --verify-tag --latest=false --title "okvault $TAG (program)" --notes "$notes"
          fi
